name: Auto Pipeline Catalog Build

on:
  schedule:
    # Runs every 30 minutes (24/7)
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish IPTV Catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Repository Code
        uses: actions/checkout@v4
        with:
          repository: neelniloy/lstv_studio-
          token: ${{ secrets.GH_PAT }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Auto Pipeline Engine
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          CONCURRENCY: 256
        run: dart run bin/build_catalog.dart
